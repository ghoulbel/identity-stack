version: 1

metadata:
  name: homelab-users
  labels:
    blueprints.goauthentik.io/description: "Family accounts for OpenWebUI SSO"

# These accounts exist because three family members already had OpenWebUI
# accounts, and OpenWebUI only ever stored bcrypt hashes — the credentials
# cannot be carried across. OpenWebUI is therefore moving to OIDC, and these
# users are the SSO side of their existing accounts.
#
# Passwords are NOT managed here. They are owned by the people themselves and
# are set in the Authentik UI (Admin -> Users -> user -> Set password).
#
# This file previously did set them, from !Env so no credential entered git.
# That was removed on purpose. Authentik only re-applies a blueprint when its
# own content hash changes — it does not notice a changed environment variable
# — so the password was silently managed by "did anyone edit this file?".
# That is a trap: a typo fix in a comment would have reset both people to their
# temporary passwords without any error anywhere. Password rotation is a normal
# event and must not depend on editing infrastructure files.
#
# MARINA_TEMP_PASSWORD / MONCEF_TEMP_PASSWORD still exist in .env and are still
# generated by bootstrap.sh. They are only used to create these accounts the
# very first time. Leaving them in place is harmless now that nothing reads
# them; removing them is cleaner but would leave a freshly-rebuilt stack with
# two unusable accounts, so they are kept as a recovery path.
#
# state: present, not created, so re-running updates name/email/is_active
# rather than failing on an already-existing user.

entries:
  - model: authentik_core.user
    state: present
    identifiers:
      username: marina
    attrs:
      name: Marina Ghoul
      email: mari.g.stylas@gmail.com
      is_active: true
      type: internal

  - model: authentik_core.user
    state: present
    identifiers:
      username: moncef
    attrs:
      name: Moncef Ghoul
      email: m.ghoul@gmx.ch
      is_active: true
      type: internal